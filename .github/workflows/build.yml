name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Reject local proxy configuration
        run: '! grep -R "127\.0\.0\.1:\|proxyHost=127\.0\.0\.1\|proxyPort=7890" android'
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Fetch media_kit mpv archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64 | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z' `
            -OutFile 'build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z'
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-windows
          path: build/windows/x64/runner/Release

  build-linux:
    name: Build Linux packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm zstd
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux release bundle
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          version="${raw_version%%+*}"
          revision="${raw_version#*+}"
          [[ "$revision" == "$raw_version" ]] && revision=1
          bundle="build/linux/x64/release/bundle"
          root="$RUNNER_TEMP/cloud-audiobook-root"
          output="$RUNNER_TEMP/cloud-audiobook-output"
          rm -rf "$root" "$output"
          mkdir -p "$root/usr/bin" "$root/usr/lib/cloud-audiobook/data" \
            "$root/usr/lib/cloud-audiobook/lib" \
            "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/512x512/apps" "$output"
          cp "$bundle/cloud_audiobook" "$root/usr/lib/cloud-audiobook/"
          cp -r "$bundle/data/." "$root/usr/lib/cloud-audiobook/data/"
          cp "$bundle/lib/"*.so "$root/usr/lib/cloud-audiobook/lib/"
          if [[ -f /usr/lib/x86_64-linux-gnu/libmpv.so.2 ]]; then
            cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$root/usr/lib/cloud-audiobook/lib/"
          fi
          printf '%s\n' '#!/bin/sh' \
            'HERE=/usr/lib/cloud-audiobook' \
            'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$HERE/cloud_audiobook" "$@"' \
            > "$root/usr/bin/cloud-audiobook"
          chmod +x "$root/usr/bin/cloud-audiobook"
          printf '%s\n' '[Desktop Entry]' 'Name=云听书' 'Exec=cloud-audiobook' \
            'Icon=cloud-audiobook' 'Type=Application' 'Categories=AudioVideo;Player;' \
            > "$root/usr/share/applications/cloud-audiobook.desktop"
          cp web/icons/Icon-512.png \
            "$root/usr/share/icons/hicolor/512x512/apps/cloud-audiobook.png"

          deb="$output/cloud-audiobook_${version}_${revision}_amd64.deb"
          deb_root="$RUNNER_TEMP/cloud-audiobook-deb"
          mkdir -p "$deb_root/DEBIAN"
          cp -a "$root/." "$deb_root/"
          cat > "$deb_root/DEBIAN/control" <<CONTROL
          Package: cloud-audiobook
          Version: $version
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: CloudAudiobook
          Depends: libgtk-3-0, libmpv2
          Description: Private audiobook library and player
           CloudAudiobook plays audiobooks from local, WebDAV, and SMB sources.
          CONTROL
          dpkg-deb --build --root-owner-group "$deb_root" "$deb" >/dev/null

          rpm_top="$RUNNER_TEMP/cloud-audiobook-rpm"
          mkdir -p "$rpm_top/BUILD" "$rpm_top/RPMS" "$rpm_top/SOURCES" "$rpm_top/SPECS" "$rpm_top/SRPMS"
          cp -a "$root" "$rpm_top/source-root"
          cat > "$rpm_top/SPECS/cloud-audiobook.spec" <<SPEC
          Name: cloud-audiobook
          Version: $version
          Release: $revision
          Summary: Private audiobook library and player
          License: MIT
          BuildArch: x86_64
          Requires: gtk3
          Requires: mpv-libs

          %description
          CloudAudiobook plays audiobooks from local, WebDAV, and SMB sources.

          %prep
          %build
          %install
          rm -rf %{buildroot}
          cp -a %{_topdir}/source-root/. %{buildroot}/

          %files
          /usr/bin/cloud-audiobook
          /usr/lib/cloud-audiobook
          /usr/share/applications/cloud-audiobook.desktop
          /usr/share/icons/hicolor/512x512/apps/cloud-audiobook.png
          SPEC
          rpmbuild --define "_topdir $rpm_top" -bb "$rpm_top/SPECS/cloud-audiobook.spec" >/dev/null
          cp "$rpm_top/RPMS/x86_64/"*.rpm "$output/"

          mkdir -p "$output/arch-root" "$output/arch-work"
          cp -a "$root/." "$output/arch-root/"
          cat > "$output/arch-work/PKGBUILD" <<'PKGBUILD'
          pkgname=cloud-audiobook
          pkgver=__VERSION__
          pkgrel=__REVISION__
          pkgdesc='Private audiobook library and player'
          arch=('x86_64')
          license=('MIT')
          depends=('gtk3' 'mpv')
          source=()
          sha256sums=()

          package() {
            cp -a "$startdir/../arch-root/." "$pkgdir/"
          }
          PKGBUILD
          sed -i "s/__VERSION__/$version/; s/__REVISION__/$revision/" "$output/arch-work/PKGBUILD"
          docker run --rm -v "$output:/workspace" archlinux:latest bash -euxo pipefail -c '
            pacman -Sy --noconfirm base-devel
            useradd -m builder
            chown -R builder:builder /workspace
            su builder -c "cd /workspace/arch-work && makepkg --force --nodeps"
          '
          sudo chown -R "$(id -u):$(id -g)" "$output"
          cp "$output/arch-work/cloud-audiobook-${version}-${revision}-x86_64.pkg.tar.zst" "$output/"
          rm -rf "$output/arch-root" "$output/arch-work"

          appdir="$RUNNER_TEMP/CloudAudiobook.AppDir"
          mkdir -p "$appdir/usr/bin/data" "$appdir/usr/bin/lib"
          cp "$bundle/cloud_audiobook" "$appdir/usr/bin/"
          cp -r "$bundle/data/." "$appdir/usr/bin/data/"
          cp "$bundle/lib/"*.so "$appdir/usr/bin/lib/"
          if [[ -f /usr/lib/x86_64-linux-gnu/libmpv.so.2 ]]; then
            cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$appdir/usr/bin/lib/"
          fi
          printf '%s\n' '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"' \
            'cd "$HERE/usr/bin"' \
            'exec ./cloud_audiobook "$@"' \
            > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Name=云听书' 'Exec=cloud_audiobook' \
            'Icon=cloud-audiobook' 'Type=Application' 'Categories=AudioVideo;Player;' \
            > "$appdir/cloud-audiobook.desktop"
          cp web/icons/Icon-512.png "$appdir/cloud-audiobook.png"
          appimage_tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl -L --fail --retry 3 \
            -o "$appimage_tool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$appimage_tool"
          ARCH=x86_64 "$appimage_tool" "$appdir" \
            "$output/cloud-audiobook-v${version}-x86_64.AppImage"

          cp "$bundle/cloud_audiobook" "$output/cloud-audiobook-linux-bundle"
          ls -lh "$output"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-linux
          path: ${{ runner.temp }}/cloud-audiobook-output/*
