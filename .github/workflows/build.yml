name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Reject local proxy configuration
        run: '! grep -R "127\.0\.0\.1:\|proxyHost=127\.0\.0\.1\|proxyPort=7890" android'
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Fetch media_kit mpv archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64 | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z' `
            -OutFile 'build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z'
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-windows
          path: build/windows/x64/runner/Release

  build-linux:
    name: Build Linux packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libayatana-appindicator3-dev rpm zstd
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux release bundle
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euxo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          version="${raw_version%%+*}"
          revision="${raw_version#*+}"
          [[ "$revision" == "$raw_version" ]] && revision=""
          version_suffix=""
          [[ -n "$revision" ]] && version_suffix="_$revision"
          bundle="build/linux/x64/release/bundle"
          root="$RUNNER_TEMP/cloud-audiobook-root"
          output="$RUNNER_TEMP/cloud-audiobook-output"
          rm -rf "$root" "$output"
          mkdir -p "$root/usr/bin" "$root/usr/lib/cloud-audiobook/data" \
            "$root/usr/lib/cloud-audiobook/lib" \
            "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/512x512/apps" "$output"
          cp "$bundle/cloud_audiobook" "$root/usr/lib/cloud-audiobook/"
          cp -r "$bundle/data/." "$root/usr/lib/cloud-audiobook/data/"
          cp "$bundle/lib/"*.so "$root/usr/lib/cloud-audiobook/lib/"
          printf '%s\n' '#!/bin/sh' \
            'HERE=/usr/lib/cloud-audiobook' \
            'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$HERE/cloud_audiobook" "$@"' \
            > "$root/usr/bin/cloud-audiobook"
          chmod +x "$root/usr/bin/cloud-audiobook"
          printf '%s\n' '[Desktop Entry]' 'Name=云听书' 'Exec=cloud-audiobook' \
            'Icon=cloud-audiobook' 'Type=Application' 'Categories=AudioVideo;Player;' \
            > "$root/usr/share/applications/cloud-audiobook.desktop"
          cp web/icons/Icon-512.png \
            "$root/usr/share/icons/hicolor/512x512/apps/cloud-audiobook.png"

          deb="$output/cloud-audiobook_${version}${version_suffix}_amd64.deb"
          deb_root="$RUNNER_TEMP/cloud-audiobook-deb"
          mkdir -p "$deb_root/DEBIAN"
          cp -a "$root/." "$deb_root/"
          cat > "$deb_root/DEBIAN/control" <<CONTROL
          Package: cloud-audiobook
          Version: $version
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: CloudAudiobook
          Depends: libgtk-3-0, libmpv2, libayatana-appindicator3-1
          Description: Private audiobook library and player
           CloudAudiobook plays audiobooks from local, WebDAV, and SMB sources.
          CONTROL
          dpkg-deb --build --root-owner-group "$deb_root" "$deb" >/dev/null

          rpm_top="$RUNNER_TEMP/cloud-audiobook-rpm"
          mkdir -p "$rpm_top/BUILD" "$rpm_top/RPMS" "$rpm_top/SOURCES" "$rpm_top/SPECS" "$rpm_top/SRPMS"
          cp -a "$root" "$rpm_top/source-root"
          cat > "$rpm_top/SPECS/cloud-audiobook.spec" <<SPEC
          Name: cloud-audiobook
          Version: $version
          Release: ${revision:-1}
          Summary: Private audiobook library and player
          License: MIT
          BuildArch: x86_64
          Requires: gtk3
          Requires: mpv-libs
          Requires: libayatana-appindicator-gtk3

          %description
          CloudAudiobook plays audiobooks from local, WebDAV, and SMB sources.

          %prep
          %build
          %install
          rm -rf %{buildroot}
          cp -a %{_topdir}/source-root/. %{buildroot}/

          %files
          /usr/bin/cloud-audiobook
          /usr/lib/cloud-audiobook
          /usr/share/applications/cloud-audiobook.desktop
          /usr/share/icons/hicolor/512x512/apps/cloud-audiobook.png
          SPEC
          rpmbuild --define "_topdir $rpm_top" -bb "$rpm_top/SPECS/cloud-audiobook.spec" >/dev/null
          cp "$rpm_top/RPMS/x86_64/"*.rpm "$output/"

          arch_root="$RUNNER_TEMP/cloud-audiobook-arch-root"
          rm -rf "$arch_root"
          mkdir -p "$arch_root"
          cp -a "$root/." "$arch_root/"
          package_size="$(du -sk "$arch_root" | awk '{print $1 * 1024}')"
          cat > "$arch_root/.PKGINFO" <<PKGINFO
          pkgname = cloud-audiobook
          pkgbase = cloud-audiobook
          pkgver = ${version}-${revision:-1}
          pkgdesc = Private audiobook library and player
          url = https://github.com/tc1911/CloudAudiobook
          builddate = $(date +%s)
          packager = CloudAudiobook
          size = $package_size
          arch = x86_64
          license = MIT
          depend = gtk3
          depend = mpv
          depend = libayatana-appindicator
          PKGINFO
          tar --zstd --format=gnu --owner=0 --group=0 --numeric-owner \
            -C "$arch_root" \
            -cf "$output/cloud-audiobook-${version}-${revision:-1}-x86_64.pkg.tar.zst" \
            .PKGINFO usr
          test -s "$output/cloud-audiobook-${version}-${revision:-1}-x86_64.pkg.tar.zst"

          appdir="$RUNNER_TEMP/CloudAudiobook.AppDir"
          mkdir -p "$appdir/usr/bin/data" "$appdir/usr/bin/lib"
          cp "$bundle/cloud_audiobook" "$appdir/usr/bin/"
          cp -r "$bundle/data/." "$appdir/usr/bin/data/"
          cp "$bundle/lib/"*.so "$appdir/usr/bin/lib/"
          if [[ -f /usr/lib/x86_64-linux-gnu/libmpv.so.2 ]]; then
            cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$appdir/usr/bin/lib/"
          fi
          printf '%s\n' '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"' \
            'cd "$HERE/usr/bin"' \
            'exec ./cloud_audiobook "$@"' \
            > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Name=云听书' 'Exec=cloud_audiobook' \
            'Icon=cloud-audiobook' 'Type=Application' 'Categories=AudioVideo;Player;' \
            > "$appdir/cloud-audiobook.desktop"
          cp web/icons/Icon-512.png "$appdir/cloud-audiobook.png"
          appimage_tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl -L --fail --retry 3 \
            -o "$appimage_tool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$appimage_tool"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "$appimage_tool" "$appdir" \
            "$output/cloud-audiobook-v${version}-x86_64.AppImage"

          tar -C "$bundle" -czf "$output/cloud-audiobook-linux-bundle.tar.gz" .
          ls -lh "$output"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audiobook-linux
          path: ${{ runner.temp }}/cloud-audiobook-output/*

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-audiobook-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          version="${raw_version%%+*}"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          }
          revision="${raw_version#*+}"
          if [[ "$revision" == "$raw_version" || "$revision" != "1" ]]; then
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Build suffix is ${revision:-none}; artifacts only, no GitHub Release."
            exit 0
          fi
          echo "release_enabled=true" >> "$GITHUB_OUTPUT"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"

          mv dist/cloud-audiobook_*.deb "$release_dir/"
          mv dist/cloud-audiobook-*.rpm "$release_dir/"
          mv dist/cloud-audiobook-*.pkg.tar.zst "$release_dir/"
          mv dist/cloud-audiobook-v*.AppImage "$release_dir/"
          mv dist/cloud-audiobook-linux-bundle.tar.gz "$release_dir/"

          mv dist/app-release.apk "$release_dir/cloud-audiobook-v${version}-android.apk"
          (cd dist && zip -qr "$release_dir/cloud-audiobook-v${version}-windows-x64.zip" .)
          ls -lh "$release_dir"
      - name: Create GitHub Release
        if: steps.prepare.outputs.release_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "CloudAudiobook $GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/release-assets"/*
